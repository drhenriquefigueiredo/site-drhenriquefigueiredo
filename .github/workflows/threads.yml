name: Post do dia no Threads
on:
  schedule:
    - cron: "40 21 * * *"   # 18:40 em Brasília, logo depois do post do feed no Instagram (Make, 18:30)
  workflow_dispatch: {}
permissions:
  contents: write
concurrency: threads
jobs:
  threads:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Publicar no Threads o post aprovado de hoje
        env:
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
          THREADS_CHAVE: ${{ secrets.THREADS_CHAVE }}
        run: python3 tools/threads.py
      - name: Registrar o que foi publicado
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A content/redes/threads_publicados.json content/redes/threads_token.enc 2>/dev/null || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Threads publicados [skip netlify]"
          git pull --rebase -q origin main
          git push
